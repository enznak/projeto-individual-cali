<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arise | Blog de calistenia</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/cadastro_style.css">
    <link rel="icon" href="./img/logo_arise.png">
</head>

<body>
    <div class="header">
        <a href="./index.html"><img src="./img/logo_arise.png" alt=""></a>
        <div class="pages">
            <a href="./index.html">HOME</a>
            <a href="./blog.html">BLOG</a>
            <a href="./exercicio.html">EXERCÍCIOS</a>
            <a href="./sobre.html">SOBRE MIM</a>
            <a href="./login.html" class="login">ENTRAR</a>
        </div>
    </div>

    <div class="main">
        <div class="card">
            <h1></h1>
            <div class="form">
                <span>Nome de usuário</span>
                <input id="nome_input" type="text" placeholder="Digite o seu nome de usuário">

                <span>E-mail</span>
                <input id="email_input" type="text" placeholder="email@exemplo.com">

                <span>Senha</span>
                <input id="senha_input" type="text" placeholder="Digite sua senha">

                <span>Confirmar a senha</span>
                <input id="senha_input2" type="text" placeholder="Digite sua senha novamente">

                <button onclick="cadastrar()">Cadastrar</button>
            </div>
        </div>
    </div>

    <div class="footer">

    </div>
</body>
<script>
    function cadastrar() {
        var nomeVar = nome_input.value;
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        // Enviando o valor da nova input
        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    setTimeout(() => {
                        window.location = "login.html";
                    }, "2000");
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }
</script>

</html>
