<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arise | Blog de calistenia</title>

    <script src="./sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/cadastro_style.css">
    <link rel="icon" href="./img/logo_arise.png">
</head>

<body>
    <div class="container">
        <div class="navbar-container">
            <a href="./index.html"><img src="./img/logo_arise.png" alt=""></a>
            <div class="navbar">
                <a href="./index.html">HOME</a>
                <a href="./blog.html">BLOG</a>
                <a href="./exercicio.html">EXERCÍCIOS</a>
                <a href="./sobre.html">SOBRE</a>
            </div>
            <div class="login">
                <a href="./login.html" id="div_visitante">ENTRAR</a>
                <a href="./user/dashboard.html" id="div_usuario" style="display: none;">MINHA CONTA</a>
            </div>
        </div>

        <div class="main">
            <div class="card">
                <h1>Cadastre-se</h1>
                <div class="form">
                    <label>Nome de usuário</label>
                    <input id="nome_input" type="text" placeholder="Digite o seu nome de usuário" class="user">
                    <span id="nm_erro0" class="erro"></span>
                    <span id="nm_erro1" class="erro"></span>
                    <span id="nm_erro2" class="erro"></span>

                    <label>E-mail</label>
                    <input id="email_input" type="text" placeholder="email@exemplo.com" class="email">
                    <span id="em_erro0" class="erro"></span>
                    <span id="em_erro1" class="erro"></span>
                    <span id="em_erro2" class="erro"></span>


                    <label>Senha</label>
                    <input id="senha_input" type="password" placeholder="Digite sua senha" class="password">
                    <span id="sn_erro0" class="erro"></span>
                    <span id="sn_erro1" class="erro"></span>
                    <span id="sn_erro2" class="erro"></span>


                    <label>Confirmar a senha</label>
                    <input id="senha2_input" type="password" placeholder="Digite sua senha novamente" class="password">
                    <span id="sn2_erro0" class="erro"></span>
                    <span id="sn2_erro1" class="erro"></span>
                    <span id="sn2_erro2" class="erro"></span>

                    <button type="submit" onclick="; limpar(); validar()">Cadastrar</button>
                    <span class="center">Já possui acesso? <a href="./login.html">Entrar na conta</a></span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">

    </div>
</body>
<script>
    function validar() {
        let form = {
            nm: nome_input.value,
            em: email_input.value,
            sn: senha_input.value,
            sn2: senha2_input.value
        }

        let erro = false
        if (form.nm == "" || form.nm.length > 30 || form.nm.length < 3) {
            erro = true
            nm_erro0.style.display = 'block'
            if (form.nm == "") {
                nm_erro0.innerHTML = `Insira o nome de usuário.`
            } if (form.nm.length > 30) {
                nm_erro0.innerHTML = `O nome de usuário não pode ter mais de 30 caracteres.`
            } if (form.nm.length < 3 && !form.nm == "") {
                nm_erro0.innerHTML = `O nome de usuário precisa ter pelo menos 3 caracteres.`
            }
        } if (form.em == "" || form.em.length > 320 || form.em.length < 4 || !form.em.includes("@") || !form.em.includes(".")) {
            erro = true
            em_erro0.style.display = 'block'
            em_erro0.innerHTML = `Insira um e-mail válido.`
        } if (form.sn == "" || form.sn.length > 100 || form.sn.length < 8) {
            erro = true
            sn_erro0.style.display = 'block'
            if (form.sn == "") {
                sn_erro0.innerHTML = `Insira uma senha.`
            } if (form.sn.length > 100) {
                sn_erro0.innerHTML = `A senha não pode ter mais de 100 caracteres.`
            } if (form.sn.length < 8 && !form.sn == "") {
                sn_erro0.innerHTML = `A senha precisa ter pelo menos 8 caracteres.`
            }
        } if (form.sn2 == "" || form.sn2 != form.sn) {
            erro = true
            sn2_erro0.style.display = 'block'
            if (form.sn2 == "") {
                sn2_erro0.innerHTML = `Insira a senha novamente.`
            } if (form.sn2 != form.sn) {
                sn2_erro0.innerHTML = `As senhas precisam ser iguais.`
            }
        }

        if (!erro) {
            cadastrar()
        }
    }

    function cadastrar() {
        var nomeVar = nome_input.value;
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        // Enviando o valor da nova input
        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {

                } else {
                    sn2_erro0.style.display = 'block'
                    sn2_erro0.innerHTML = `Nome de usuário ou e-mail inválidos.`
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }

    function limpar() {
        nm_erro0.style.display = 'none'
        nm_erro1.style.display = 'none'
        nm_erro2.style.display = 'none'
        em_erro0.style.display = 'none'
        em_erro1.style.display = 'none'
        em_erro2.style.display = 'none'
        sn_erro0.style.display = 'none'
        sn_erro1.style.display = 'none'
        sn_erro2.style.display = 'none'
        sn2_erro0.style.display = 'none'
        sn2_erro1.style.display = 'none'
        sn2_erro2.style.display = 'none'
    }
</script>

</html>
