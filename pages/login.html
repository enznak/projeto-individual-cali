<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arise | Login</title>

    <script src="./sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/login_style.css">
    <link rel="icon" href="./img/logo_arise.png">
</head>

<body>
    <div class="container">
        <div class="navbar-container">
            <a href="./index.html"><img src="./img/logo_arise.png" alt=""></a>
            <div class="navbar">
                <a href="./index.html">HOME</a>
                <a href="./blog.html">BLOG</a>
                <a href="./exercicio.html">EXERCÍCIOS</a>
                <a href="./sobre.html">SOBRE</a>
            </div>
            <div class="login">
                <a href="./login.html" id="div_visitante">ENTRAR</a>
                <a href="./user/dashboard.html" id="div_usuario" style="display: none;">MINHA CONTA</a>
            </div>
        </div>

        <div class="main">
            <div id="login" class="card">
                <h1>Bem-vindo(a)</h1>
                <div class="form">
                    <label>Nome de usuário</label>
                    <input id="nome_input" class="user" type="text" placeholder="Digite o seu nome de usuário">
                    <span id="nm_erro0" class="erro"></span>

                    <label>Senha</label>
                    <input id="senha_input" class="password" type="password" placeholder="Digite sua senha">
                    <span id="sn_erro0" class="erro"></span>
                    <a href="">Esqueceu a senha?</a>

                    <button type="submit" onclick="limpar(); validar()">ENTRAR</button>
                    <span>Ainda não possui acesso? <a href="./cadastro.html">Criar conta</a></span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">

    </div>
</body>

<script>
    function validar() {
        let form = {
            nm: nome_input.value,
            sn: senha_input.value
        }

        let erro = false
        if (form.nm == "") {
            erro = true
            nm_erro0.innerHTML = `Insira o nome de usuário.`
            nm_erro0.style.display = 'block'
        }
        if (form.sn == "") {
            erro = true
            sn_erro0.innerHTML = `Insira uma senha.`
            sn_erro0.style.display = 'block'
        }
        
        if (erro == false) {
            entrar()
        }

    }
    function entrar() {
        var nomeVar = nome_input.value;
        var senhaVar = senha_input.value;

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.PERM_USUARIO = json.perm;

                    window.location = "./user/dashboard.html"
                });
            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    sn_erro0.innerHTML = texto;
                    sn_erro0.style.display = 'block'
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })
        return false;
    }

    function limpar() {
        nm_erro0.style.display = 'none'
        sn_erro0.style.display = 'none'
    }

</script>

</html>
