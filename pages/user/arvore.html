<script>
    window.onload = nomeUsuario()

    var push_moves = [
        { pup: true },
        { pLean: false },
        { pLeanPU: false },
        { pTuck: false },
        { pTuckPU: false },
        { pTuckP: false },
        { pStraddle: false },
        { pStraddlePU: false },
        { pStraddleP: false },
        { pFull: false }
    ]

    var pull_moves = {

    }

    var balance_moves = {

    }

    function ativarMove(move) {
        var check = document.getElementById(`node${move}`)
        var line = document.getElementById(`line${move}`)
        var lab = check.closest('label')

        if (check) {
            lab.classList.add('active')
            line.style.display = 'block'
        } else {
            lab.classList.remove('active')
            line.style.display = 'none'
        }
    }

    function salvar() {
        push_moves = [
            { pup: true },
            { pLean: document.getElementById('node1').checked },
            { pLeanPU: document.getElementById('node1.1').checked },
            { pTuck: document.getElementById('node2').checked },
            { pTuckPU: document.getElementById('node2.1').checked },
            { pTuckP: document.getElementById('node2.2').checked },
            { pStraddle: document.getElementById('node3').checked },
            { pStraddlePU: document.getElementById('node3.1').checked },
            { pStraddleP: document.getElementById('node3.2').checked },
            { pFull: document.getElementById('node4').checked }
        ]

        var pushVar = push_moves
        var pullVar = pull_moves
        var balanceVar = balance_moves
        var IDVar = sessionStorage.ID_USUARIO

        fetch("/arvore/movimentos-usuario", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                IDServer: IDVar,
                pushServer: pushVar,
                pullServer: pullVar,
                balanceServer: balanceVar,
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }

</script>
