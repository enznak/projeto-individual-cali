<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arise | Login</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/login_style.css">
    <link rel="icon" href="./img/logo_arise.png">
</head>

<body>
    <div class="main-page">
        <div class="header">
            <a href="./index.html"><img src="./img/logo_arise.png" alt=""></a>
            <div class="pages">
                <a href="./index.html">HOME</a>
                <a href="./blog.html">BLOG</a>
                <a href="./exercicio.html">EXERCÍCIOS</a>
                <a href="./sobre.html">SOBRE MIM</a>
            </div>
            <div class="login">
                <a href="./login.html">ENTRAR</a>
            </div>
        </div>

        <div class="main">
            <div id="login" class="card">
                <h1>Bem-vindo(a)</h1>
                <div class="form">
                    <label for="">Nome de usuário</label>
                    <input id="email_input" class="user" type="text" placeholder="Digite o seu nome de usuário">

                    <label for="">Senha</label>
                    <input id="senha_input" class="password" type="text" placeholder="Digite sua senha">
                    <a href="">Esqueceu a senha?</a>

                    <button onclick="entrar()">ENTRAR</button>
                    <span>Ainda não possui acesso? <a href="./cadastro.html">Criar conta</a></span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">

    </div>
</body>

<script>
    function entrar() {
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.PERM_USUARIO = json.perm;

                    window.location = "./dashboard/cards.html"
                });
            }

        })
    }
</script>

</html>
