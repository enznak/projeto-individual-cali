                        <label class="node" style="top: 425px; left: 800px;">
                            <input type="checkbox" id="push-node8" onchange="ativarMove('push', 8)">

                <!-- PULL -->

                    <h3 class="tree-title">PULL</h3>
                    <svg class="lines">
                        <line x1="200" y1="275" x2="400" y2="275" />
                        <line x1="200" y1="275" x2="400" y2="125" />
                        <line x1="200" y1="275" x2="600" y2="425" />
                        <line id="pull-line1" x1="400" y1="275" x2="600" y2="275" style="display: none;" />
                        <line id="pull-line2" x1="600" y1="275" x2="800" y2="275" style="display: none;" />
                        <line id="pull-line3" x1="800" y1="275" x2="1000" y2="275" style="display: none;" />
                        <line id="pull-line2_2" x1="600" y1="425" x2="800" y2="425" style="display: none;" />
                        <line id="pull-line1_1" x1="400" y1="125" x2="600" y2="125" style="display: none;" />
                        <line id="pull-line2_1" x1="600" y1="125" x2="800" y2="125" style="display: none;" />
                        <line id="pull-line3_1" x1="800" y1="125" x2="1000" y2="275" style="display: none;" />

                    </svg>

                    <div>
                        <div class="node active" style="top: 275px; left: 200px;">Australian Pull-up</div>

                        <label class="node" style="top: 125px; left: 400px;">
                            <input type="checkbox" id="pull-node2" onchange="ativarMove('pull', 2)">

                        </label>

                        <label class="node" style="top: 275px; left: 600px;">
                            <input type="checkbox" id="pull-node3" onchange="ativarMove('pull', 3)">
                            <span>Explosive Pull-up</span>
                        </label>

                        <label class="node" style="top: 125px; left: 600px;">
                            <input type="checkbox" id="pull-node4" onchange="ativarMove('pull', 4)">
                            <span>Archer Pull-up</span>
                        </label>

                        <label class="node" style="top: 425px; left: 600px;">
                            <input type="checkbox" id="pull-node5" onchange="ativarMove('pull', 5)">
                            <span>Typewriter Pull-up</span>
                        </label>

                        <label class="node" style="top: 275px; left: 800px;">
                            <input type="checkbox" id="pull-node6" onchange="ativarMove('pull', 6)">
                            <span>Muscle-up</span>
                        </label>

                        <label class="node" style="top: 125px; left: 800px;">
                            <input type="checkbox" id="pull-node7" onchange="ativarMove('pull', 7)">
                            <span>Front Lever Tuck</span>

                <!-- BALANCE -->

                        <line id="balance-line3_1" x1="800" y1="125" x2="1000" y2="275" style="display: none;" />

                    <div>

                        </label>

                        <label class="node" style="top: 125px; left: 400px;">
                            <input type="checkbox" id="balance-node2" onchange="ativarMove('balance', 2)">
                            <span>Tripod Headstand</span>
                        </label>

                        <label class="node" style="top: 275px; left: 600px;">
                            <input type="checkbox" id="balance-node3" onchange="ativarMove('balance', 3)">
                            <span>Headstand</span>
                        </label>

                        <label class="node" style="top: 125px; left: 600px;">
                            <input type="checkbox" id="balance-node4" onchange="ativarMove('balance', 4)">
                            <span>Wall Handstand</span>
                        </label>

                        <label class="node" style="top: 425px; left: 600px;">
                            <input type="checkbox" id="balance-node5" onchange="ativarMove('balance', 5)">
                            <span>Elbow Stand</span>
                        </label>

                        <label class="node" style="top: 275px; left: 800px;">
                            <input type="checkbox" id="balance-node6" onchange="ativarMove('balance', 6)">
                            <span>Handstand</span>
                        </label>

                        <label class="node" style="top: 125px; left: 800px;">
                            <input type="checkbox" id="balance-node7" onchange="ativarMove('balance', 7)">
                            <span>Handstand Push-up Negativa</span>
                        </label>

                            <span>Press to Handstand</span>
                        </label>

                        <label class="node" style="top: 275px; left: 1000px;">

                            <span>Handstand Push-up</span>

                </div>
            </div>
        </div>

</body>

<script>
    window.onload = nomeUsuario()
    window.onload = buscarArvore()

    var push_moves = [
        { pup: true },
        { pLean: false },
        { pLeanPU: false },
        { pTuck: false },
        { pTuckPU: false },
        { pTuckP: false },
        { pStraddle: false },
        { pStraddlePU: false },
        { pStraddleP: false },
        { pFull: false }
    ]

    var pull_moves = [
        { base: true },
        { pullUp: false },
        { chestBar: false },
        { explosive: false },
        { archer: false },
        { typewriter: false },
        { muscleUp: false },
        { flTuck: false },
        { flAdvTuck: false },
        { frontLever: false }
    ];

    var balance_moves = [
        { base: true },
        { crow: false },
        { tripod: false },
        { headstand: false },
        { wallHs: false },
        { elbowStand: false },
        { handstand: false },
        { hsNeg: false },
        { pressHs: false },
        { hspu: false }
    ];

    var res = []

    function buscarArvore() {
        var idUsuario = sessionStorage.ID_USUARIO
        fetch(`/arvore/buscarMovimentos/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(resposta)
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    res = resposta
                    atualizarMoves()
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function atualizarMoves() {
        // PUSH: movimentos 0-9 no array res → nodes 1-9 no HTML
        for (let i = 1; i <= 9; i++) {
            const checkbox = document.getElementById(`push-node${i}`);
            if (checkbox && res[i]) {
                checkbox.checked = res[i].desbloqueado == 1;
                if (checkbox.checked) {
                    checkbox.closest('label').classList.add('active');
                    const line = document.getElementById(`push-line${i}`);
                    if (line) line.style.display = 'block';
                }
            }
        }

        // PULL: movimentos 10-19 no array res → nodes 1-9 no HTML
        for (let i = 1; i <= 9; i++) {
            const checkbox = document.getElementById(`pull-node${i}`);
            const resIndex = i + 10;
            if (checkbox && res[resIndex]) {
                checkbox.checked = res[resIndex].desbloqueado == 1;
                if (checkbox.checked) {
                    checkbox.closest('label').classList.add('active');
                    const line = document.getElementById(`pull-line${i}`);
                    if (line) line.style.display = 'block';
                }
            }
        }

        // BALANCE: movimentos 20-29 no array res → nodes 1-9 no HTML
        for (let i = 1; i <= 9; i++) {
            const checkbox = document.getElementById(`balance-node${i}`);
            const resIndex = i + 20;
            if (checkbox && res[resIndex]) {
                checkbox.checked = res[resIndex].desbloqueado == 1;
                if (checkbox.checked) {
                    checkbox.closest('label').classList.add('active');
                    const line = document.getElementById(`balance-line${i}`);
                    if (line) line.style.display = 'block';
                }
            }
        }
    }

    function ativarMove(tipo, move) {
        const check = document.getElementById(`${tipo}-node${move}`);
        const line = document.getElementById(`${tipo}-line${move}`);
        const lab = check.closest('label');

        if (check.checked) {
            lab.classList.add('active');
            if (line) line.style.display = 'block';
        } else {
            lab.classList.remove('active');
            if (line) line.style.display = 'none';
        }
    }

    function redefinir() {
        var checks = document.querySelectorAll('.tree input[type="checkbox"]');
        var labels = document.querySelectorAll('.tree label.node');
        var lines = document.querySelectorAll('.tree .lines line[id]');

        for (let i = 0; i < checks.length; i++) {
            checks[i].checked = false;
        }

        for (let i = 0; i < labels.length; i++) {
            labels[i].classList.remove('active');
        }

        for (let i = 0; i < lines.length; i++) {
            lines[i].style.display = 'none';
        }
    }

    function salvar() {
        push_moves = [
            { pup: true },
            { pLean: document.getElementById('push-node1').checked },
            { pLeanPU: document.getElementById('push-node2').checked },
            { pTuck: document.getElementById('push-node3').checked },
            { pTuckPU: document.getElementById('push-node4').checked },
            { pTuckP: document.getElementById('push-node5').checked },
            { pStraddle: document.getElementById('push-node6').checked },
            { pStraddlePU: document.getElementById('push-node7').checked },
            { pStraddleP: document.getElementById('push-node8').checked },
            { pFull: document.getElementById('push-node9').checked }
        ];

        pull_moves = [
            { base: true },
            { pullUp: document.getElementById('pull-node1').checked },
            { chestBar: document.getElementById('pull-node2').checked },
            { explosive: document.getElementById('pull-node3').checked },
            { archer: document.getElementById('pull-node4').checked },
            { typewriter: document.getElementById('pull-node5').checked },
            { muscleUp: document.getElementById('pull-node6').checked },
            { flTuck: document.getElementById('pull-node7').checked },
            { flAdvTuck: document.getElementById('pull-node8').checked },
            { frontLever: document.getElementById('pull-node9').checked }
        ];

        balance_moves = [
            { base: true },
            { crow: document.getElementById('balance-node1').checked },
            { tripod: document.getElementById('balance-node2').checked },
            { headstand: document.getElementById('balance-node3').checked },
            { wallHs: document.getElementById('balance-node4').checked },
            { elbowStand: document.getElementById('balance-node5').checked },
            { handstand: document.getElementById('balance-node6').checked },
            { hsNeg: document.getElementById('balance-node7').checked },
            { pressHs: document.getElementById('balance-node8').checked },
            { hspu: document.getElementById('balance-node9').checked }
        ];

        var pushVar = push_moves
        var pullVar = pull_moves
        var balanceVar = balance_moves
        var IDVar = sessionStorage.ID_USUARIO

        fetch("/arvore/movimentos-usuario", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                IDServer: IDVar,
                pushServer: pushVar,
                pullServer: pullVar,
                balanceServer: balanceVar,
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }

</script>
